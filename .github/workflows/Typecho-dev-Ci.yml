name: Typecho Dev CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: write

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  php:
    name: PHP ${{ matrix.php }} Tests
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
    - name: Checkout code
      uses: actions/checkout@main
    - name: Setup PHP only
      uses: shivammathur/setup-php@main
      with:
        php-version: ${{ matrix.php }}
    - name: Test
      run: |
        find . -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -l -n | (! grep -v "No syntax errors detected" )
  build:
    name: Typecho Build
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'wjm13206/typecho' }}
    needs:
        - php
    steps:
    - name: Checkout code
      uses: actions/checkout@main
    - name: Build
      run: |
        mkdir build
        cp -r LICENSE.txt index.php install.php admin install usr var build/
        mkdir build/usr/uploads/
        chmod 755 build/usr/uploads/
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> build/usr/build_number.txt
        sed -i "s/const BUILD = '0'/const BUILD = '$BUILD_NUMBER'/" build/var/Typecho/Common.php
        rm -rf build/admin/src
        rm -rf build/usr/themes/classic-22/static/scss
        cd build && zip -q -r typecho.zip * && mv typecho.zip ../ && cd -
    - name: Upload Release Asset
      if: ${{ github.event_name == 'release' && github.event.release.tag_name != '' }}
      run: gh release upload "${{ github.event.release.tag_name }}" ./typecho.zip --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Upload Build Artifact
      if: ${{ github.event_name != 'pull_request' && github.event_name != 'release' }}
      run: |
        TAG=$(gh api repos/${{ github.repository }}/releases/365080590 --jq '.tag_name')
        gh release upload "$TAG" ./typecho.zip --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Trigger language build
      if: ${{ github.event_name == 'release' }}
      run: |
        curl -XPOST -H "Authorization: token ${{ secrets.WORKFLOW_TOKEN }}" \
          -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Content-Type: application/json" \
          https://api.github.com/repos/wjm13206/typecho/actions/workflows/update.yml/dispatches --data '{"ref": "master"}'